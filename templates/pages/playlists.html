<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOSAD — Playlists</title>
  <link rel="stylesheet" href="../../static/styles/base.css" />
  <link rel="stylesheet" href="../../static/styles/navbar.css" />
  <link rel="stylesheet" href="../../static/styles/pages.css" />
</head>
<body>

  <nav class="top-nav">
    <a href="/" class="brand">MOSAD</a>
    <a href="/" class="nav-link">Workspace</a>
    <a href="/single" class="nav-link">Single Song</a>
    <a href="/playlists" class="nav-link active">Playlists</a>
    <a href="/credits" class="nav-link">Credits</a>
  </nav>

  <div class="playlists-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <span class="sidebar-label">Actions</span>
        <button class="sidebar-btn" id="btn-new-playlist">+ New Playlist</button>
        <button class="sidebar-btn" id="btn-import-playlist">&#8627; Import JSON</button>
        <input type="file" id="import-file-input" accept=".json" class="hidden" />
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <span class="sidebar-label">Your Playlists</span>
      </div>
      <div id="playlist-nav-list"></div>
    </aside>

    <!-- Main content -->
    <main class="playlist-content" id="playlist-content">
      <!-- Empty state shown by JS -->
    </main>

  </div>

  <!-- New playlist modal -->
  <div class="modal-overlay hidden" id="modal-new">
    <div class="modal">
      <h3>New Playlist</h3>
      <div class="field">
        <label>Name</label>
        <input type="text" id="new-playlist-name" placeholder="My Playlist" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-create-playlist">Create</button>
        <button class="btn btn-ghost" id="btn-cancel-new">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add song modal (search + metadata) -->
  <div class="modal-overlay hidden" id="modal-add-song">
    <div class="modal" style="max-width:520px">
      <h3>Add Song to Playlist</h3>

      <!-- Step 1: search -->
      <div id="add-song-search-step">
        <div class="search-bar" style="margin-bottom:12px">
          <input type="search" id="add-search-input" placeholder="Search on YouTube..." />
          <button class="btn btn-primary btn-sm" id="btn-add-search">Search</button>
        </div>
        <div id="add-search-results" style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;"></div>
      </div>

      <!-- Step 2: metadata (hidden until song selected) -->
      <div id="add-song-meta-step" class="hidden">
        <div class="field">
          <label>Title</label>
          <input type="text" id="add-title" />
        </div>
        <div class="field">
          <label>Artist</label>
          <input type="text" id="add-artist" />
        </div>
        <div class="field">
          <label>Album <span class="muted">(optional)</span></label>
          <input type="text" id="add-album" placeholder="Leave empty if unknown" />
        </div>
        <input type="hidden" id="add-url" />
        <div class="modal-actions">
          <button class="btn btn-primary" id="btn-confirm-add">Add to Playlist</button>
          <button class="btn btn-ghost" id="btn-back-add">&#8592; Back</button>
        </div>
      </div>

      <button class="btn btn-ghost btn-sm" id="btn-cancel-add" style="margin-top:14px;width:100%;justify-content:center;">Cancel</button>
    </div>
  </div>

  <!-- Edit song metadata modal -->
  <div class="modal-overlay hidden" id="modal-edit-song">
    <div class="modal">
      <h3>Edit Song Metadata</h3>
      <input type="hidden" id="edit-song-id" />
      <div class="field">
        <label>Title</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="field">
        <label>Artist</label>
        <input type="text" id="edit-artist" />
      </div>
      <div class="field">
        <label>Album <span class="muted">(optional)</span></label>
        <input type="text" id="edit-album" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-save-edit">Save</button>
        <button class="btn btn-ghost" id="btn-cancel-edit">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../../static/scripts/main.js"></script>
  <script src="../../static/scripts/playlists.js"></script>
</body>
</html>
